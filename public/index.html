<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sherry</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23c96f4a'/%3E%3Crect x='14' y='8' width='4' height='10' rx='2' fill='white'/%3E%3Cpath d='M10 15a6 6 0 0 0 12 0' stroke='white' stroke-width='2.5' fill='none'/%3E%3Crect x='15' y='22' width='2' height='4' fill='white'/%3E%3C/svg%3E">
</head>
<body>
<main class="widget">
  <button id="orb" class="orb" aria-label="Hold to talk">
    <span class="halo" aria-hidden="true"></span>
  </button>
  <p id="status" class="status"></p>

  <section class="exchange" aria-live="polite">
    <p id="heard" class="heard"></p>
    <p id="said" class="said"></p>
  </section>

  <button id="text-toggle" class="ghost" aria-expanded="false" aria-controls="textform">type instead</button>
  <form id="textform" class="textform" hidden>
    <input id="textinput" type="text" placeholder="Type a command…" autocomplete="off" aria-label="Type a command">
    <button type="submit">Ask</button>
  </form>
</main>
<script src="app.js"></script>
</body>
</html>
