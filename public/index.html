<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sherry — voice-first desktop agent</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23c96f4a'/%3E%3Crect x='14' y='8' width='4' height='10' rx='2' fill='white'/%3E%3Cpath d='M10 15a6 6 0 0 0 12 0' stroke='white' stroke-width='2.5' fill='none'/%3E%3Crect x='15' y='22' width='2' height='4' fill='white'/%3E%3C/svg%3E">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>Sherry</h1>
    </div>
    <div class="integrations" id="integrations" aria-label="Integration status"></div>
  </header>

  <section class="stage">
    <button id="mic" class="mic" aria-label="Hold to talk">
      <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
        <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        <line x1="12" y1="18" x2="12" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="ring" aria-hidden="true"></span>
    </button>
    <p id="status" class="status">Hold the mic — or hold <kbd>space</kbd> — and talk</p>
    <p id="hint" class="hint">Try: “brief me” · “what’s on my plate” · “message Shy I’ll be late” · “what’s new”</p>
  </section>

  <section class="logwrap">
    <ol id="log" class="log" aria-live="polite"></ol>
  </section>

  <footer class="foot">
    <span id="stt-note"></span>
    <button id="text-toggle" class="ghost">type instead</button>
  </footer>
  <form id="textform" class="textform" hidden>
    <input id="textinput" type="text" placeholder="Type a command…" autocomplete="off">
    <button type="submit">Ask</button>
  </form>
</main>
<script src="app.js"></script>
</body>
</html>
