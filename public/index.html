<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sherry</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="favicon.png" type="image/png">
</head>
<body>
<main class="widget">
  <button id="orb" class="orb" aria-label="Hold to talk">
    <span class="halo" aria-hidden="true"></span>
  </button>
  <p id="status" class="status"></p>

  <section class="exchange" aria-live="polite">
    <p id="heard" class="heard"></p>
    <p id="said" class="said"></p>
  </section>

  <button id="text-toggle" class="ghost" aria-expanded="false" aria-controls="textform">type instead</button>
  <form id="textform" class="textform" hidden>
    <input id="textinput" type="text" placeholder="Type a command…" autocomplete="off" aria-label="Type a command">
    <button type="submit">Ask</button>
  </form>
</main>
<script src="app.js"></script>
</body>
</html>
